<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>種目一覧</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="card">
        <h2>種目一覧</h2>
        <form id="default-form" th:action="@{/exercises/default}" method="post">
            <input type="hidden" id="selected-id" name="id">
        </form>
        <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>種目名</th>
                    <th>部位</th>
                    <th>グラフ初期表示</th>
                    <th>編集</th>
                    <th>削除</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="exercise : ${exercises}">
                    <td th:text="${exercise.name}">種目名</td>
                    <td th:text="${exercise.bodyPart}">部位名</td>
                    <td>
                        <input type="radio" name="defaultFlag"
                               th:checked="${exercise.isDefault}"
                               th:data-id="${exercise.id}">
                    </td>
                    <td>
                        <form th:action="@{/exercises/edit/{id}(id=${exercise.id})}">
                            <button type="submit" class="btn-secondary">編集</button>
                        </form>
                    </td>
                    <td>
                        <form th:action="@{/exercises/delete/{id}(id=${exercise.id})}" method="post">
                            <button type="submit" class="btn-danger">削除</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
        <div th:if="${errorMessage != null}" class="error-message">
            <p th:text="${errorMessage}"></p>
        </div>
        <div class="link-list">
            <a th:href="@{/exercises/form}">種目を登録する</a>
            <a th:href="@{/menu}">メニューへ戻る</a>
        </div>
    </div>
</div>

<script th:src="@{/js/exercises/exercisesList.js}"></script>
</body>
</html>
