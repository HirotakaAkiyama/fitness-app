<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>トレーニング強度遷移</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="card">
        <h2>トレーニング強度の遷移</h2>
        <form th:action="@{/training/showGraph}" method="get">
            <div class="form-group">
                <label for="exerciseId">表示する種目</label>
                <select name="exerciseId" id="exerciseId">
                    <option value="">---選択してください---</option>
                    <option th:each="exercise : ${exercises}"
                            th:value="${exercise.id}"
                            th:text="${exercise.name}"
                            th:selected="${exercise.id == (selectExercise != null ? selectExercise : defaultExercise.id)}">
                    </option>
                </select>
            </div>
        </form>
        <div class="graph-container">
            <canvas id="graph"></canvas>
        </div>
        <div class="link-list">
            <a th:href="@{/menu}">メニューへ戻る</a>
        </div>
    </div>
</div>
<script th:inline="javascript">
    const data = [[${showDefault}]];
</script>
<script th:src="@{/js/training/showGraph.js}"></script>
</body>
</html>
