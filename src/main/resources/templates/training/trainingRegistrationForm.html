<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>トレーニング記録登録</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="card">
        <h2>トレーニング記録登録</h2>
        <form th:action="@{/training/save}" method="post">
            <div class="form-group">
                <label for="exerciseId">種目名</label>
                <select name="exerciseId" id="exerciseId">
                    <option value="">---選択してください---</option>
                    <option th:each="exercise : ${training}"
                            th:value="${exercise.id}"
                            th:text="${exercise.name}"
                            th:selected="${trainingLogsForm != null and exercise.id == trainingLogsForm.exerciseId}">
                    </option>
                </select>
            </div>
            <div class="form-group">
                <label for="logDate">記録日</label>
                <input type="date" id="logDate" name="logDate" th:value="${trainingLogsForm?.logDate}" />
            </div>
            <div class="form-group">
                <label for="memo">メモ</label>
                <input type="text" id="memo" name="memo" th:value="${trainingLogsForm?.memo}" />
            </div>

            <div id="sets-container">
                <div class="set-section">
                    <div class="set-row">
                        <label>セット1</label>
                        <label>重量</label>
                        <input type="number" name="sets[0].weightKg" />
                        <label>回数</label>
                        <input type="number" name="sets[0].reps" />
                    </div>
                </div>
            </div>

            <button type="button" id="add-set-btn" class="btn btn-primary">セット追加</button>

            <button type="submit">登録</button>
        </form>
        <div class="link-list">
            <a th:href="@{/menu}">メニューへ戻る</a>
        </div>
    </div>
</div>
<script th:src="@{/js/training/addSets.js}"></script>
</body>
</html>
