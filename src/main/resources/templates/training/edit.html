<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記録編集</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="card">
        <h2>記録編集</h2>
        <form th:action="@{/training/edit/{id}(id=${target.id})}" method="post">
            <div class="form-group">
                <label for="logDate">記録日</label>
                <input type="date" id="logDate" name="logDate" th:value="${target.logDate}">
            </div>
            <div class="form-group">
                <label for="memo">メモ</label>
                <input type="text" id="memo" name="memo" th:value="${target.memo}">
            </div>

            <div th:each="set, stat : ${target.sets}" class="set-section">
                <label th:text="${set.setNumber} + 'セット目'">セット数</label>
                <div class="set-row">
                    <label th:for="'sets[' + ${stat.index} + '].weightKg'">重量</label>
                    <input type="number" th:id="'sets[' + ${stat.index} + '].weightKg'" th:name="'sets[' + ${stat.index} + '].weightKg'" th:value="${set.weightKg}">
                    <label th:for="'sets[' + ${stat.index} + '].reps'">回数</label>
                    <input type="number" th:id="'sets[' + ${stat.index} + '].reps'" th:name="'sets[' + ${stat.index} + '].reps'" th:value="${set.reps}">
                    <input type="hidden" th:name="'sets[' + ${stat.index} + '].id'" th:value="${set.id}">
                </div>
            </div>

            <input type="hidden" name="exerciseId" th:value="${target.exercises.id}">
            <button type="submit">この内容で編集する</button>
        </form>
        <div class="link-list">
            <a th:href="@{/training/logs}">記録一覧へ戻る</a>
            <a th:href="@{/menu}">メニューへ戻る</a>
        </div>
    </div>
</div>
</body>
</html>
